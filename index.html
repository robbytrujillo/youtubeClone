<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>YouTube Clone</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- CDN Bootstrap -->
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top">
      <img
        src="assets/images/youtube-logo.png"
        style="width: 100px; margin-left: 2%; margin-top: 0%"
      />
      <h5 style="margin-left: -1%">Clone</h5>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">
      <div class="row mb-4">
        <div class="col-md-4">
          <input
            type="text"
            id="searchInput"
            class="form-control"
            placeholder="Cari video..."
          />
        </div>
        <div class="col-md-4">
          <select id="categoryFilter" class="form-control">
            <option value="">Semua Kategori</option>
            <option value="Nature">Nature</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Education">Education</option>
            <option value="Documentary">Documentary</option>
          </select>
        </div>
        <div class="col-md-4 text-right">
          <button id="toggleDark" class="btn btn-white text-dark rounded-pill">
            🌓 Dark Mode
          </button>
        </div>
      </div>

      <div class="row" id="video-list">
        <!-- Video cards akan dimuat di sini lewat JavaScript -->
      </div>
    </div>

    <!-- Modal untuk memutar video YouTube -->
    <div
      class="modal fade"
      id="videoModal"
      tabindex="-1"
      aria-labelledby="videoModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content bg-dark">
          <div class="modal-body p-0" id="modalVideo">
            <!-- iframe akan dimasukkan via JavaScript -->
          </div>
        </div>
      </div>
    </div>

    <!-- Script -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
  </body>
</html>
